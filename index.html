<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0F1012">
<title>Setlist Buddy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one dark, one-handed screen. Act stepper on top, timeline in the middle, the capture button docked under the thumb. */
:root{
  --bg:#0F1012; --surface:#1B1C1F; --raised:#26272B; --line:#2F3034; --line-strong:#45464B;
  --fg:#F2F2F0; --muted:#A3A4A8; --faint:#6B6C71;
  --rec:#FF5A4E; --ok:#7BD88F; --warn:#F0B45A;
  --sans:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'Roboto Mono', monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px 0}
.tbtn{min-height:44px;padding:0 10px;border:none;background:transparent;font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px;border-radius:10px}
.tbtn:active{background:var(--surface)}
.where{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;line-height:1.3;border:none;background:transparent;min-height:44px;padding:2px 8px;border-radius:10px;max-width:46vw}
.where:active{background:var(--surface)}

/* act stepper */
.stepper{padding:10px 20px 0;display:flex;flex-direction:column;gap:10px}
.steprow{display:flex;align-items:center;gap:8px}
.nav{width:44px;height:56px;flex:none;border:none;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center}
.nav[disabled]{color:#4A4B50;cursor:default}
.act{flex:1;min-width:0;min-height:56px;border:none;background:var(--surface);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 8px}
.act .name{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dots{display:flex;gap:4px;padding:0 52px}
.dots span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.dots span.past{background:#6A6B70}.dots span.now{background:var(--fg)}

/* empty state */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 20px;text-align:center}
.empty p{margin:0;font-size:14px;color:var(--muted);max-width:30ch;line-height:1.45}

/* capture button */
.cap{border-radius:999px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;text-align:center;background:var(--fg);color:var(--bg);border:8px solid var(--line-strong);font-weight:600;line-height:1.2;touch-action:none;transition:transform .12s ease}
.cap.big{width:min(260px,70vw);height:min(260px,70vw);font-size:22px}
.cap.dock{width:148px;height:148px;font-size:17px}
.cap.holding{transform:scale(.95)}
.cap.listening{background:var(--bg);color:var(--fg);border-color:var(--rec)}
.cap .sub{font-family:var(--mono);font-size:12px;font-weight:400}
.hint{font-size:11px;color:var(--muted)}

/* timeline */
.tl-head{padding:14px 20px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;font-size:12px;display:flex;align-items:center;gap:6px}
.tl{flex:1;min-height:0;overflow-y:auto;padding:0 20px;overscroll-behavior:contain}
.row{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.row .bg{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 20px;font-size:14px;font-weight:600;background:var(--raised);visibility:hidden}
.row .bg.left{justify-content:flex-end}
.row .bg.past{background:var(--rec);color:#120807}
.row .fg{position:relative;display:flex;align-items:center;gap:14px;min-height:62px;background:var(--bg);touch-action:pan-y}
.row .n{width:26px;flex:none;font-family:var(--mono);font-size:13px;color:var(--muted)}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:8px 0}
.row .label{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.rec .label{font-weight:600}
.recdot{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--rec);margin-right:6px;vertical-align:1px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.ibtn{width:44px;height:44px;flex:none;border-radius:999px;border:1px solid var(--line-strong);background:transparent;display:flex;align-items:center;justify-content:center}
.ibtn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dockbar{padding:14px 20px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.ghost{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);background:transparent;font-size:14px}
.status{justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:11px;color:var(--muted);text-align:right;line-height:1.3}

/* toast */
.toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;padding:6px 6px 6px 16px;border-radius:12px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.toast button{min-height:40px;padding:0 14px;border-radius:8px;border:none;background:var(--bg);color:var(--fg);font-weight:600;font-size:14px}

/* sheets */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.62);display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.tall{height:92%}
.sh-head{padding:16px 20px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.sh-title{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sh-title h2{margin:0;font-size:19px;font-weight:600}
.x{width:44px;height:44px;flex:none;border-radius:999px;border:1px solid var(--line-strong);background:transparent;display:flex;align-items:center;justify-content:center}
.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:10px;border:1px solid var(--fg);background:var(--bg)}
.search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:inherit;font-size:16px;color:var(--fg)}
.sh-body{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 16px;overscroll-behavior:contain}
.sh-foot{padding:12px 20px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.group{margin:16px 0 4px}
.opt{width:100%;min-height:58px;padding:8px 0;border:none;border-bottom:1px solid var(--line);background:transparent;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px}
.opt .t{font-size:17px;font-weight:600}
.opt .w{font-size:12px;color:var(--muted)}
.opt.sm{min-height:48px}.opt.sm .t{font-size:15px;font-weight:400}
.opt .tag{font-size:12px;color:var(--muted);flex:none}
.opt.next .t::after{content:" · next up";font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted)}
.wide{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line-strong);background:transparent;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.solid{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.pad{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.pad h2{margin:0;font-size:19px;font-weight:600}
.pad p{margin:0;font-size:14px;color:var(--muted);line-height:1.45}
textarea,.field{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);font-family:inherit;font-size:16px;line-height:1.4;resize:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* setlist view */
.sl{flex:1;min-height:0;overflow-y:auto;padding:0 20px 20px}
.sl h1{margin:6px 0 2px;font-size:24px;font-weight:600;text-wrap:balance}
.summary{font-size:14px;color:var(--muted)}
.sl h3{margin:22px 0 4px;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.srow{width:100%;display:flex;align-items:center;gap:12px;min-height:58px;padding:6px 0;border:none;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.srow .t{font-size:16px;font-weight:500}
.srow .m{font-size:12px;color:var(--muted)}
.pill{flex:none;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted)}
.pill.need{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.box{margin-top:22px;padding:14px 16px;border-radius:12px;background:var(--surface);font-family:var(--mono);font-size:13px;line-height:1.7;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.acts-edit .arow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.acts-edit .field{min-height:48px}
.mini{width:40px;height:44px;flex:none;border-radius:8px;border:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center}
.mini[disabled]{opacity:.35}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.card{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.card p{margin:0}
.copyrow{display:flex;align-items:center;gap:8px}
.copyrow code{flex:1;min-width:0;font-family:var(--mono);font-size:12px;word-break:break-all;user-select:text;-webkit-user-select:text}
.linkbtn{border:none;background:none;padding:0;color:var(--fg);text-decoration:underline;font-size:12px;min-height:32px}
.chipon{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sprow{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sprow input[type=checkbox]{width:22px;height:22px;margin:10px 0 0;flex:none;accent-color:var(--fg)}
.sprow.off .sptitle{color:var(--faint);text-decoration:line-through}
.sptitle{width:100%;min-height:40px;padding:6px 8px;margin-left:-8px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--fg);font-family:inherit;font-size:16px;font-weight:500}
.sptitle:focus{border-color:var(--line-strong);background:var(--bg);outline:none}
.sps{font-size:12px;color:var(--muted);line-height:1.4}
.sps a{color:inherit}
.sps.found{color:var(--ok)}.sps.check{color:var(--warn)}.sps.miss{color:var(--rec)}
.spfoot{padding:12px 20px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.spfoot .spstatus{margin:0;min-height:1em}.spfoot .spstatus:empty{display:none}.spstatus.err{color:var(--rec)}
.flagbtn{width:40px;height:40px;flex:none;border:none;background:transparent;color:var(--faint);display:flex;align-items:center;justify-content:center;border-radius:10px}
.flagbtn.on{color:var(--fg)}.flagbtn.on svg{fill:currentColor}
.tl-head .right{display:flex;align-items:center;gap:4px}
.sl h3.acth{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:0}
.sl h3.acth a,.sl h3.acth .m{font-family:var(--sans);font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted)}
.setlabel{margin:10px 0 0;font-size:12px;color:var(--muted)}
.gapline{display:flex;align-items:center;gap:10px;padding:12px 0;color:var(--muted);font-size:12px}
.gapline::before,.gapline::after{content:"";flex:1;border-top:1px dashed var(--line-strong)}
.pill.ok{color:var(--ok);border-color:rgba(123,216,143,.45)}
.pill.warn{color:var(--warn);border-color:rgba(240,180,90,.55)}
.srow.off .t{color:var(--faint);text-decoration:line-through}
.srow .sug{color:var(--muted)}
.card .row2{display:flex;gap:8px;flex-wrap:wrap}
.card .row2 .wide{flex:1;width:auto;min-width:140px}
a.wide{text-decoration:none;color:inherit}a.wide.solid{color:var(--bg)}
.wide[disabled]{opacity:.55}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- storage (IndexedDB) ---------- */
const DB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    // Storage keeps its original name so shows saved before the rename to Setlist Buddy stay put.
    const r = indexedDB.open('setlist-catcher', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('clips'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => { const d = await open(); return new Promise((res, rej) => {
    const t = d.transaction(store, mode); const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }); };
  return {
    get: (s,k) => tx(s,'readonly', o => o.get(k)),
    put: (s,k,v) => tx(s,'readwrite', o => o.put(v,k)),
    del: (s,k) => tx(s,'readwrite', o => o.delete(k))
  };
})();

/* ---------- audio ---------- */
const MIME = (() => { if (!window.MediaRecorder) return null; for (const m of ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus']) if (MediaRecorder.isTypeSupported(m)) return m; return ''; })();
const extFor = t => (t||'').includes('mp4') ? 'm4a' : (t||'').includes('ogg') ? 'ogg' : 'webm';
let liveRec = null;
async function getMic(){
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
}
async function recordClip(item){
  if (MIME === null || !navigator.mediaDevices) { item.recording = false; item.clipErr = 'This browser can’t record audio'; save(); render(); return; }
  let stream;
  try { stream = await getMic(); S.micOk = true; }
  catch (e) { S.micOk = false; item.recording = false; item.clipErr = 'Microphone blocked'; save(); render(); toast('Microphone is blocked. The time was saved; allow the mic in site settings to record clips.'); return; }
  const rec = new MediaRecorder(stream, MIME ? {mimeType: MIME, audioBitsPerSecond: 64000} : undefined);
  const chunks = [];
  rec.ondataavailable = e => e.data && e.data.size && chunks.push(e.data);
  liveRec = { rec, item, stream };
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    liveRec = null;
    const blob = new Blob(chunks, {type: rec.mimeType || MIME || 'audio/webm'});
    if (blob.size) { item.clipId = 'c-' + item.id; item.clipType = blob.type; try { await DB.put('clips', item.clipId, blob); } catch(e){ item.clipErr = 'Clip too big to store'; } }
    item.recording = false; save(); render();
  };
  rec.start(1000);
  setTimeout(() => rec.state !== 'inactive' && rec.stop(), CLIP_MS);
}
let player = null;
async function play(clipId){
  if (player) { player.pause(); URL.revokeObjectURL(player.src); player = null; }
  const blob = await DB.get('clips', clipId).catch(()=>null);
  if (!blob) { toast('That clip isn’t on this phone.'); return; }
  player = new Audio(URL.createObjectURL(blob)); player.play().catch(()=>toast('Couldn’t play that clip.'));
}

/* ---------- song picker logic ---------- */
function pickerData(a, q, forItemId){
  const c = cat(a.name);
  const band = new Set(S.show.acts.filter(x => x.name === a.name).map(x => x.id)); // every set by this band
  const logged = orderedItems().filter(i => i.title && band.has(i.actId) && i.id !== forItemId);
  const played = new Set(logged.map(i => i.title));
  const ql = (q||'').trim().toLowerCase();
  if (!c) return { likely: [], all: [], played };
  const all = Array.from(new Set([...c.tour, ...c.extra])).sort((x,y)=>x.localeCompare(y, undefined, {numeric:true}));
  if (ql) return { likely: [], all: all.filter(t => t.toLowerCase().includes(ql)), played };
  // Bands with a steady setlist: tour order, starting after the last song logged.
  // Bands that change it nightly (rotate: false): most-played order, minus what's been played.
  const last = c.rotate === false || !logged.length ? -1 : c.tour.indexOf(logged[logged.length-1].title);
  const rotated = last >= 0 ? [...c.tour.slice(last+1), ...c.tour.slice(0, last+1)] : c.tour;
  const likely = rotated.filter(t => !played.has(t)).slice(0, c.likelyCount || 8).map((t,i) => ({ t, next: i===0 && last>=0 }));
  return { likely, all, played, why: c.why };
}


/* ---------- setlist text ---------- */
function setlistText(){
  const out = [], its = orderedItems(), acts = S.show.acts;
  for (let i = 0; i < acts.length; ){
    const band = acts[i].name, group = [];
    while (i < acts.length && acts[i].name === band) group.push(acts[i++]); // consecutive sets by one band
    const parts = group.map(a => [a, its.filter(x => x.actId === a.id)]).filter(([, l]) => l.length);
    if (!parts.length) continue;
    out.push(band); let n = 0;
    for (const [a, l] of parts){
      if (a.set && group.length > 1) out.push(a.set + ':');
      l.forEach(it => out.push((++n) + '. ' + (it.title || '(unidentified, clip ' + fmtTime(it.ts) + ')')));
    }
    const p = S.show.posted && S.show.posted[band];
    if (group.some(a => a.incomplete) && !(p && p.found)) out.push('(incomplete set)');
    out.push('');
  }
  return out.join('\n').trim() || 'Nothing captured yet.';
}

/* ---------- capture button: tap vs hold ---------- */
function bindCap(){
  const b = document.getElementById('cap'); if (!b) return;
  let t, held = false, down = false;
  b.addEventListener('pointerdown', e => {
    if (S.show.items.some(i=>i.recording)) return;
    down = true; held = false; try { b.setPointerCapture(e.pointerId); } catch(_){}
    S.holding = true; b.classList.add('holding'); b.innerHTML = 'Keep holding…';
    t = setTimeout(() => { held = true; S.holding = false; if (navigator.vibrate) navigator.vibrate([15,40,15]); openPicker(); }, HOLD_MS);
  });
  const up = (fire) => () => { if (!down) return; down = false; clearTimeout(t); const wasHolding = S.holding; S.holding = false; if (fire && !held && wasHolding) capture(); else if (!held) render(); };
  b.addEventListener('pointerup', up(true));
  b.addEventListener('pointercancel', up(false));
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); capture(); } });
}
function openPicker(itemId){ S.sheet = { type:'picker', q:'', itemId: itemId || null, focus: false }; render(); }

/* ---------- swipe to remove ---------- */
function bindSwipes(){
  document.querySelectorAll('.row').forEach(row => {
    const fg = row.querySelector('.fg'), bg = row.querySelector('.bg'); let g = null;
    fg.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; g = { x: e.clientX, y: e.clientY, live: false, id: e.pointerId }; });
    fg.addEventListener('pointermove', e => {
      if (!g) return; const dx = e.clientX - g.x, dy = e.clientY - g.y;
      if (!g.live) { if (Math.abs(dy) > 12) { g = null; return; } if (Math.abs(dx) > 12) { g.live = true; try { fg.setPointerCapture(g.id); } catch(_){} } else return; }
      g.dx = dx; fg.style.transition = 'none'; fg.style.transform = `translateX(${dx}px)`;
      bg.style.visibility = 'visible'; bg.classList.toggle('left', dx < 0); bg.classList.toggle('past', Math.abs(dx) > SWIPE_PX);
      bg.querySelector('span').textContent = Math.abs(dx) > SWIPE_PX ? 'Release to remove' : 'Remove';
    });
    const end = () => { if (!g) return; const live = g.live, dx = g.dx || 0; g = null; if (!live) return;
      if (Math.abs(dx) > SWIPE_PX) removeItem(row.dataset.id);
      else { fg.style.transition = 'transform .18s ease'; fg.style.transform = 'translateX(0)'; setTimeout(()=>bg.style.visibility='hidden', 180); } };
    fg.addEventListener('pointerup', end); fg.addEventListener('pointercancel', end);
  });
}

/* ---------- export ---------- */
async function exportClips(){
  const its = orderedItems();
  const meta = { app: 'Setlist Buddy', exported: new Date().toISOString(), show: { date: S.show.date, venue: S.show.venue, city: S.show.city, acts: S.show.acts.map(a=>a.name) }, songs: [] };
  if (!window.JSZip) { toast('The zip tool didn’t load. Open the app once with signal, then try again.'); return; }
  toast('Packing clips…');
  const zip = new window.JSZip(); const folder = zip.folder('clips');
  let n = 0;
  for (const [i, it] of its.entries()){
    const a = actLabel(actById(it.actId));
    const base = String(i+1).padStart(2,'0') + ' ' + a.replace(/[^\w ]+/g,'') + ' ' + (it.ts ? fmtTime(it.ts).replace(/[:\u202f\u00a0 ]/g,'') : 'missed');
    const row = { order: i+1, act: a, time: it.ts ? new Date(it.ts).toISOString() : null, title: it.title, manuallyEntered: it.manual, from: it.from || null, note: it.note || null, clip: null, voiceNote: null };
    if (it.clipId){ const b = await DB.get('clips', it.clipId).catch(()=>null); if (b){ row.clip = 'clips/' + base + '.' + extFor(b.type); folder.file(base + '.' + extFor(b.type), b); n++; } }
    if (it.voiceId){ const b = await DB.get('clips', it.voiceId).catch(()=>null); if (b){ row.voiceNote = 'clips/' + base + ' voice.' + extFor(b.type); folder.file(base + ' voice.' + extFor(b.type), b); } }
    meta.songs.push(row);
  }
  zip.file('show.json', JSON.stringify(meta, null, 2));
  zip.file('setlist.txt', setlistText());
  const blob = await zip.generateAsync({type:'blob'});
  const name = showName(S.show.acts[S.show.acts.length-1]?.name || 'Show').replace(/[\\/:*?"<>|]+/g, '') + '.zip';
  const file = new File([blob], name, {type:'application/zip'});
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title: name}); toast('Shared ' + n + ' clip' + (n===1?'':'s') + '.'); return; } catch(e){ if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast('Saved ' + name);
}

/* ---------- event delegation ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.classList.contains('scrim') && e.target.closest('[data-stop]')) return; // clicks inside a sheet don't close it
  const a = el.dataset.a, id = el.dataset.id, s = S.show;
  const it = id ? s.items.find(i=>i.id===id) : null;
  switch (a){
    case 'prev': if (s.actIdx>0){ s.actIdx--; save(); render(); } break;
    case 'next': if (s.actIdx<s.acts.length-1){ s.actIdx++; save(); render(); } break;
    case 'bill': S.renaming = null; S.sheet = {type:'bill'}; renderLayer(); break;
    case 'goAct': s.actIdx = +el.dataset.i; S.sheet = null; save(); render(); break;
    case 'actUp': case 'actDown': { const i = +el.dataset.i, j = a==='actUp'?i-1:i+1; const cur = act(); [s.acts[i], s.acts[j]] = [s.acts[j], s.acts[i]]; s.actIdx = s.acts.indexOf(cur); save(); render(); break; }
    case 'actRename': S.renaming = +el.dataset.i; renderLayer(); document.getElementById('actname')?.focus(); break;
    case 'actAdd': S.renaming = -1; renderLayer(); document.getElementById('actname')?.focus(); break;
    case 'actSave': { const v = document.getElementById('actname').value.trim(); if (!v) break;
      if (S.renaming>=0) { const a0 = s.acts[S.renaming]; if (a0.name !== v) s.items.forEach(i => { if (i.actId === a0.id) i.sp = undefined; }); a0.name = v; const st = document.getElementById('actset'); if (st && st.value.trim()) a0.set = st.value.trim(); }
      else s.acts.push({id:'a'+uid(), name:v});
      S.renaming = null; save(); render(); break; }
    case 'actAddSet': { const cur = act(), same = s.acts.filter(a => a.name === cur.name);
      if (!cur.set) cur.set = 'Set 1';
      const n = same.filter(a => /^Set \d+$/.test(a.set || '')).length + 1;
      const at = s.acts.indexOf(same[same.length-1]) + 1;
      s.acts.splice(at, 0, { id: 'a'+uid(), name: cur.name, set: 'Set ' + n }); save(); render(); break; }
    case 'actRemove': { const i = +el.dataset.i; const cur = act(); s.acts.splice(i,1); s.actIdx = Math.max(0, s.acts.indexOf(cur)); if (s.actIdx<0) s.actIdx = 0; save(); render(); break; }
    case 'flip': s.newestFirst = !s.newestFirst; save(); render(); break;
    case 'undoLast': { const last = s.items.filter(x=>x.ts).sort((x,y)=>y.ts-x.ts)[0]; if (last) removeItem(last.id); break; }
    case 'note': S.sheet = {type:'note', itemId:id}; renderLayer(); break;
    case 'saveNote': { const t = document.getElementById('notetext'); if (it && t) it.note = t.value.trim(); S.sheet = null; save(); render(); runLyrics(); break; }
    case 'playVoice': if (it && it.voiceId) play(it.voiceId); break;
    case 'play': if (it && it.clipId) play(it.clipId); break;
    case 'pick': addManual(el.dataset.t, S.sheet.itemId); break;
    case 'recordInstead': S.sheet = null; capture(); break;
    case 'closeSheet': if (e.target === el || el.tagName === 'BUTTON') { S.sheet = null; S.renaming = null; renderLayer(); } break;
    case 'toastUndo': { const u = S.toast && S.toast.undo; S.toast = null; if (u) u(); renderLayer(); break; }
    case 'toSetlist': S.view = 'setlist'; render(); break;
    case 'toCapture': S.view = 'capture'; render(); wake(); break;
    case 'endShow': S.sheet = {type:'end'}; renderLayer(); break;
    case 'confirmEnd': s.ended = true; S.sheet = null; S.view = 'setlist'; save(); if (S.wake) { S.wake.release().catch(()=>{}); } render(); syncWatch().catch(()=>{}); runLyrics(); break;
    case 'item': S.sheet = {type:'item', itemId:id}; renderLayer(); break;
    case 'rename': openPicker(id); break;
    case 'moveUp': case 'moveDown': {
      const same = orderedItems().filter(i=>i.actId===it.actId); const k = same.indexOf(it), j = a==='moveUp'?k-1:k+1;
      if (j>=0 && j<same.length){ const o = same[j]; [it.pos, o.pos] = [o.pos, it.pos]; save(); render(); } break; }

/* ---------- Send to Spotify ---------- */
const longDate = d => new Date(d+'T12:00').toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
function spCfg(){ const s = S.show; s.sp = s.sp || { name: '', offActs: [], preferOriginal: false, playlist: null }; return s.sp; }
// Standard name: "BandName M-D-YY", e.g. "Basement 11-4-26". The band is the last act included (the headliner).
function showName(band){ const [y, m, d] = S.show.date.split('-').map(Number); return `${band} ${m}-${d}-${String(y).slice(-2)}`; }
function spDefaultName(){ const s = S.show, c = spCfg(); const acts = s.acts.filter(a => !c.offActs.includes(a.id) && s.items.some(i => i.actId === a.id && i.title));
  const head = acts[acts.length-1] || s.acts[s.acts.length-1]; return showName(head ? head.name : 'Live'); }
function spSongs(){ // songs that would go to Spotify, in setlist order

}
function spIncluded(){ return spSongs().filter(i => !i.spOff); }
function spQuery(it){ const { title, coverOf } = SPOT.splitCover(it.title); return { title, coverOf, artist: actById(it.actId)?.name || '' }; }
function spUris(){ return spIncluded().filter(i => i.sp && i.sp.uri).map(i => i.sp.uri); }
function spPhase(){

}
function spRowStatus(it){

  const link = `<a href="${esc(it.sp.url)}" target="_blank" rel="noopener">${esc(it.sp.name)} · ${esc(it.sp.artists)}</a>`;

function renderSpotify(){

  const found = inc.filter(i => i.sp && i.sp.uri).length, unsure = inc.filter(i => i.sp && i.sp.uri && !i.sp.confident).length, miss = inc.filter(i => i.sp === null).length;

  else conn = `<p class="note">Spotify connected · <button class="linkbtn" data-a="spDisconnect">Disconnect</button></p>`;
  const rows = s.acts.filter(a => !c.offActs.includes(a.id)).map(a => {
    const list = songs.filter(i => i.actId === a.id); if (!list.length) return '';

        return `<button class="chip${on?' chipon':''}" style="min-height:44px" data-a="spAct" data-act="${a.id}" aria-pressed="${on}">${esc(actLabel(a))} · ${k}</button>`; }).join('')}</div>
      ${hasCover ? `<label class="note" style="display:flex;gap:10px;align-items:center;margin-top:14px;min-height:44px"><input type="checkbox" id="preforig" data-a="spPref" ${c.preferOriginal?'checked':''} style="width:20px;height:20px"> Use the original artist’s version of covers</label>` : ''}
      ${rows || '<p class="note" style="margin-top:20px">No named songs yet. Name your songs on the setlist first.</p>'}
      ${unnamed ? `<p class="note" style="margin-top:14px">${unnamed} unnamed song${unnamed===1?' is':'s are'} left out. Name ${unnamed===1?'it':'them'} on the setlist to include ${unnamed===1?'it':'them'}.</p>` : ''}

function spRerender(){ if (S.view === 'spotify') renderSpotify(); }
function spFail(e){

async function spEnsureConnected(resume){
  if (!SPOT.clientId()) { S.spError = true; S.spStatus = 'Add your Spotify Client ID first.'; spRerender(); return false; }
  if (!SPOT.isConnected()) { await saveNow().catch(()=>{}); await SPOT.login(resume); return false; }
  return true;
}
async function spMatch(){

    while (idx < todo.length) {
      const it = todo[idx++];

      it.sp = r.track ? { uri: r.track.uri, name: r.track.name, artists: r.track.artists.map(a => a.name).join(', '), url: r.track.external_urls?.spotify || 'https://open.spotify.com/track/' + r.track.id, confident: r.confident } : null;
      S.spMatching.delete(it.id); done++; S.spBusy = `Matching ${done} of ${todo.length}…`; save(); spRerender();

  catch (e) { spFail(e); }

async function spCreate(){

/* ---------- notifications (via the helper) ---------- */
const b64uBytes = s => { const b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function pushOn(){
  const h = helper(); S.pushMsg = '';
  if (!h) throw new Error('Add the helper’s address first.');
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !window.Notification) throw new Error('This browser can’t show notifications. Install the app to your home screen and try again.');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('Notifications are blocked for this site. Allow them in the site settings, then try again.');
  const reg = await navigator.serviceWorker.ready;
  const r = await fetch(h + '/vapid'); const d = await r.json();
  if (!d.publicKey) throw new Error(d.message || 'The helper couldn’t make a notification key. Check its KV binding.');
  let sub = await reg.pushManager.getSubscription();
  const want = b64uBytes(d.publicKey);
  if (sub && sub.options && sub.options.applicationServerKey) {
    const have = new Uint8Array(sub.options.applicationServerKey);
    if (have.length !== want.length || have.some((v, i) => v !== want[i])) { await sub.unsubscribe(); sub = null; }
  }
  sub = sub || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: want });
  S.settings.subId = S.settings.subId || ('p' + uid() + uid());
  S.settings.notify = true; await saveSettings();
  await syncWatch();
}
async function pushOff(){
  S.settings.notify = false; await saveSettings();
  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch (e) {}
  syncWatch(true).catch(() => {});
}
// Tells the helper which recent shows to keep an eye on. Sends the whole list each time.
async function syncWatch(clear){

  let sub = null; try { const reg = await navigator.serviceWorker.ready; sub = await reg.pushManager.getSubscription(); } catch (e) {}

  if (S.show.ended) S.view = 'setlist';
  render(); wake();
  route();
  window.addEventListener('hashchange', route);
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { const d = e.data || {}; if (d.open) { location.hash = d.open; route(); } });
  runLyrics(); autoCheck(); syncWatch().catch(()=>{});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
