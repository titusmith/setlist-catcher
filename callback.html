<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1012">
<title>Connecting Spotify</title>
<style>
:root{--bg:#0F1012;--fg:#F2F2F0;--muted:#A3A4A8;--rec:#FF5A4E;color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:16px/1.5 'IBM Plex Sans',system-ui,sans-serif;padding:0 max(20px,env(safe-area-inset-left,0px))}
main{max-width:34ch;display:flex;flex-direction:column;gap:14px;text-align:center}
p{margin:0;color:var(--muted)}
a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:600;text-decoration:none}
.err{color:var(--rec)}
</style>
</head>
<body>
<main><h1 style="margin:0;font-size:20px;font-weight:600" id="h">Connecting Spotify…</h1><p id="msg">One moment.</p></main>
<script src="spotify.js"></script>
<script>
(async () => {
  try {
    const resume = await SPOT.finishLogin(location.search);
    location.replace('./#spotify' + (resume ? '-' + resume : ''));
  } catch (e) {
    document.getElementById('h').textContent = 'Spotify didn’t connect';
    const m = document.getElementById('msg'); m.textContent = e.message; m.className = 'err';
    const a = document.createElement('a'); a.href = './#spotify'; a.textContent = 'Back to Setlist Buddy';
    document.querySelector('main').append(a);
  }
})();
</script>
</body>
</html>
